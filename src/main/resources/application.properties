# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3307/comida_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Table Creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execute initial SQL data scripts automatically
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

