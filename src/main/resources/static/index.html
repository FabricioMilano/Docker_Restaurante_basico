<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Pedidos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1>Gerenciamento de Pedidos</h1>
</header>

<div class="container">

    <!-- SESSÃO PRODUTOS -->
    <div class="section-box">
        <h2>Produtos</h2>
        <form id="form-produto">
            <div class="form-group">
                <label for="prod-nome">Nome do Produto:</label>
                <input type="text" id="prod-nome" required>
            </div>
            <div class="form-group">
                <label for="prod-preco">Preço (R$):</label>
                <input type="number" step="0.01" id="prod-preco" required>
            </div>
            <div class="form-group">
                <label for="prod-descricao">Descrição:</label>
                <input type="text" id="prod-descricao">
            </div>
            <button type="submit">Cadastrar Produto</button>
        </form>

        <h3 class="mt-20">Lista de Produtos</h3>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Descrição</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
        </table>
    </div>

    <!-- SESSÃO NOVO PEDIDO -->
    <div class="section-box">
        <h2>Novo Pedido</h2>
        <form id="form-pedido">
            <div class="form-group">
                <label for="ped-cliente">Nome do Cliente:</label>
                <input type="text" id="ped-cliente" required>
            </div>
            <div class="form-group">
                <label>Selecione os Produtos:</label>
                <div id="lista-checkbox-produtos" class="checkbox-group"></div>
            </div>
            <button type="submit" class="btn-success">Criar Pedido</button>
        </form>
    </div>

    <!-- SESSÃO KANBAN DE PEDIDOS -->
    <div class="section-box">
        <h2>Acompanhamento de Pedidos</h2>
        <div class="kanban">
            <div class="column">
                <h3>Recebidos</h3>
                <div id="coluna-recebido"></div>
            </div>
            <div class="column">
                <h3>Preparando</h3>
                <div id="coluna-preparando"></div>
            </div>
            <div class="column">
                <h3>Pronto</h3>
                <div id="coluna-pronto"></div>
            </div>
        </div>
    </div>

</div>

<script src="/js/script.js"></script>
</body>
</html>
